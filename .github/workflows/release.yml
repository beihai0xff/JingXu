name: macOS build and tag release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # Explicit release channel. Developer ID failures never fall back to ad-hoc.
  RELEASE_MODE: adhoc
  # Match the toolchain used to resolve and validate Package.resolved locally.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

concurrency:
  group: jingxu-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and check
        run: zsh Scripts/build.sh check

  sign:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      dmg: ${{ steps.metadata.outputs.dmg }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag against main and application version
        id: metadata
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 Scripts/release-metadata.py --ref "$RELEASE_REF" --mode "$RELEASE_MODE" --output "$RUNNER_TEMP/jingxu-release"
      - name: Build, check and ad-hoc sign the unnotarized prerelease
        if: env.RELEASE_MODE == 'adhoc'
        run: zsh Scripts/build.sh adhoc
      - name: Build, check, sign and notarize with an isolated keychain
        if: env.RELEASE_MODE == 'release'
        env:
          DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
          DEVELOPER_TEAM_ID: ${{ vars.DEVELOPER_TEAM_ID }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash Scripts/ci-package-app.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jingxu-macos-arm64
          path: |
            outputs/${{ steps.metadata.outputs.dmg }}
            outputs/${{ steps.metadata.outputs.dmg }}.sha256
            outputs/RELEASE.md
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jingxu-macos-arm64
          path: release
      - name: Publish verified assets without overwriting existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.sign.outputs.version }}
          BUILT_COMMIT: ${{ needs.sign.outputs.commit }}
          DMG_NAME: ${{ needs.sign.outputs.dmg }}
          PRERELEASE: ${{ needs.sign.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          test "$RELEASE_TAG" = "v$VERSION"
          # Refuse publication if the tag moved after this run checked it out.
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$BUILT_COMMIT"
          sha256sum -c "${DMG_NAME}.sha256"
          # An API/authentication error must fail closed, not be treated as absence.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' > existing-tags.txt
          if grep -Fxq -- "$RELEASE_TAG" existing-tags.txt; then
            echo "Release $RELEASE_TAG already exists; nothing will be overwritten."
            exit 1
          fi
          # Leave a recoverable draft on partial upload failure. Never --clobber.
          gh release create "$RELEASE_TAG" \
            "$DMG_NAME" "${DMG_NAME}.sha256" \
            --verify-tag --draft --prerelease="$PRERELEASE" --latest=false \
            --title "镜序 $VERSION" --notes-file RELEASE.md
          # Check server digests for both files before making the draft public.
          # The by-tag REST endpoint does not return unpublished drafts. Resolve the
          # authenticated draft from the release list, then query its numeric ID.
          # The list endpoint can lag immediately after creation. Retry only an
          # empty result; API errors and ambiguous results still fail closed.
          RELEASE_ID=""
          for _attempt in 1 2 3 4 5 6; do
            RELEASE_ID="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft == true) | .id")"
            test -z "$RELEASE_ID" || break
            sleep 2
          done
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]] || { echo "Expected exactly one release draft"; exit 1; }
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > uploaded.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          files = [os.environ['DMG_NAME']]
          files.append(files[0] + '.sha256')
          assets = {a['name']: a for a in json.loads(Path('uploaded.json').read_text())['assets']}
          if set(assets) != set(files):
              raise SystemExit('Unexpected or missing release assets; draft retained')
          for name in files:
              digest = 'sha256:' + hashlib.sha256(Path(name).read_bytes()).hexdigest()
              if assets[name].get('digest') != digest:
                  raise SystemExit('Remote digest mismatch; draft retained')
          PY
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE" --latest=false
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease

  update-cask:
    needs: [sign, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: jingxu-cask-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Update tap only after verified Release publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          gh api "repos/$GH_REPO/contents/Casks/jingxu.rb?ref=main" > "$RUNNER_TEMP/cask.json"
          python3 Scripts/update-cask.py "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/cask.json" > "$RUNNER_TEMP/cask-update.json"
          if test -s "$RUNNER_TEMP/cask-update.json"; then
            # Contents API SHA is a compare-and-swap guard: never force-push main.
            gh api --method PUT "repos/$GH_REPO/contents/Casks/jingxu.rb" --input "$RUNNER_TEMP/cask-update.json" --jq .commit.sha
          fi
